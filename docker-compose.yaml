services:
  copilot:
    build:
      context: ./build/copilot
      target: ${COPILOT_BUILD_TARGET:-base}
    # Keep variants separate when switching between workspaces without rebuilding.
    image: ${COMPOSE_PROJECT_NAME:-copilot}-copilot:${COPILOT_BUILD_TARGET:-base}
    # Launchers provide a unique project-specific name for `docker compose run` containers.
    working_dir: /workspace
    #stdin_open: true
    #tty: true
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - COPILOT_CONFIG_DIR=${COPILOT_CONFIG_DIR:-/workspace/.copilot}
      - COPILOT_AUTO_ALLOW_ALL=${COPILOT_AUTO_ALLOW_ALL:-0}
      - COPILOT_STACK_CONFIG_DIR=/copilot-stack-config
    volumes:
      - ./config/copilot:/copilot-stack-config
    restart: no
